  --alert:#E48688;--alert-soft:#3B2225;--per:#9DB8E6;--per-soft:#1F2B40;--ok:#6CC49F;--ok-soft:#1B342A;--on:#10181C;--lift:0 8px 24px rgba(0,0,0,.3);}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.55 'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .top{background:rgba(23,34,39,.92)}}
:root[data-theme="dark"] .top{background:rgba(23,34,39,.92)}
.top-inner{max-width:1120px;margin:0 auto;padding:14px 20px 8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:19px;letter-spacing:-.02em;background:none;border:0;padding:0}
.brand small{font-weight:500;color:var(--muted);font-size:13px;letter-spacing:0;margin-left:2px}
.switch{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px;margin-left:auto}
.switch button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-size:13.5px;color:var(--muted);font-weight:500}
.switch button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(29,46,56,.12)}
.tabs{max-width:1120px;margin:0 auto;padding:0 14px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 12px 12px;border-bottom:2px solid transparent;color:var(--muted);white-space:nowrap;font-size:14.5px;font-weight:500}
.tabs button.on{border-color:var(--brand);color:var(--ink);font-weight:600}
.badge{display:inline-block;min-width:19px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--brand);color:var(--on);font-size:11.5px;line-height:19px;text-align:center;font-weight:700}
.badge.alert{background:var(--alert)}
main{max-width:1120px;margin:0 auto;padding:28px 20px 56px}
h1{font-size:clamp(30px,5vw,48px);line-height:1.1;letter-spacing:-.03em;margin:0 0 16px;max-width:17ch;font-weight:600}
h2{font-size:24px;letter-spacing:-.02em;margin:0 0 2px;font-weight:600}
h3{font-size:15.5px;margin:0;font-weight:600}
.lede{color:var(--muted);max-width:56ch;margin:0 0 24px;font-size:17px}
.sub{color:var(--muted);margin:0 0 20px;font-size:14.5px}
.section{margin-top:28px}
.head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head .sub{margin:0}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.sh small{color:var(--muted);font-size:13px}

.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:10px;font-weight:600;font-size:14.5px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on)}
.btn.primary:hover{background:var(--brand-ink);border-color:var(--brand-ink)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--muted)}
.btn.small{padding:6px 12px;font-size:13.5px;border-radius:8px}

.btn:disabled{opacity:.45;cursor:default}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.panel.flush{padding:0;overflow:hidden}
.cols{display:grid;gap:16px}
@media(min-width:900px){.cols{grid-template-columns:1.35fr 1fr}.cols.even{grid-template-columns:1fr 1fr}}

/* Intro */
.hero{display:grid;gap:32px}
@media(min-width:880px){.hero{grid-template-columns:1.1fr .9fr;align-items:center}}
.strip{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--lift)}
.strip-head{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);margin-bottom:14px}
.day24{position:relative;height:60px;border-radius:10px;background:var(--bg);overflow:hidden}
.seg{position:absolute;top:6px;bottom:6px;display:flex;align-items:center;padding:0 12px;font-size:13px;font-weight:600;border-radius:7px}
.seg.n{background:var(--night-soft);color:var(--night);left:.5%;width:28%}
.seg.d{background:var(--day-soft);color:var(--day);left:29.5%;width:32.5%}
.seg.o{left:63%;width:32.5%;color:var(--alert);background:repeating-linear-gradient(135deg,var(--alert-soft) 0 7px,transparent 7px 13px);border:1.5px dashed var(--alert)}
.hours{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);margin-top:6px}
.strip-foot{display:flex;gap:10px;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:14px}
.photo{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:4/5;box-shadow:var(--lift);background:var(--brand-soft);margin:0}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 40%;display:block}
.photo .float{position:absolute;left:14px;right:14px;bottom:14px;background:rgba(255,255,255,.95);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:14px;color:#1D2E38;line-height:1.35}
.photo .float span{color:#6B7D87;font-size:12.5px}
.roles-strip{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 24px}
.reqs{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.reqs li{font-size:14px;padding-left:22px;position:relative}
.reqs li::before{content:'';position:absolute;left:4px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--brand-soft);border:2px solid var(--brand)}
.ladder{list-style:none;margin:8px 0 4px;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ladder li{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;font-size:14px;background:var(--surface);border-top:1px solid var(--line)}
.ladder li:first-child{border-top:0}
.ladder li span{color:var(--muted)}
.ladder li.on{background:var(--brand-soft);color:var(--brand-ink)}
.ladder li.on span{color:inherit}
.hint{background:var(--tint);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13.5px}
.choose{display:grid;gap:12px;margin-top:32px}
@media(min-width:640px){.choose{grid-template-columns:1fr 1fr}}
.choice{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
.choice:hover{border-color:var(--brand)}
.choice strong{display:block;font-size:17px;margin-bottom:4px}
.choice span{color:var(--muted);font-size:14.5px}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:14px;counter-reset:s}
@media(min-width:760px){.steps{grid-template-columns:repeat(4,1fr)}}
.steps li{counter-increment:s;padding-top:14px;border-top:1px solid var(--line);font-size:14.5px}
.steps li::before{content:counter(s);display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);font-weight:700;font-size:13px;margin-bottom:8px}
.steps li span{color:var(--muted);display:block;font-size:13.5px}

/* Filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filters select{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink);font-weight:600}

/* Shift cards */
.list{display:grid;gap:10px}
.shift{display:grid;grid-template-columns:56px 1fr auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;text-align:left;width:100%}
.shift:hover{border-color:var(--faint)}
.date{text-align:center;border-right:1px solid var(--line);padding-right:14px}
.date .dn{font-size:26px;font-weight:600;line-height:1;letter-spacing:-.02em}
.date .dw{font-size:12.5px;color:var(--muted);margin-top:4px}
.meta{min-width:0}
.meta .where{font-size:13.5px;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.pill{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;line-height:1.7}
.pill.day{background:var(--day-soft);color:var(--day)}
.pill.late{background:var(--late-soft);color:var(--late)}
.pill.night{background:var(--night-soft);color:var(--night)}
.pill.urgent{background:var(--alert-soft);color:var(--alert)}
.pill.muted{background:var(--bg);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.brand{background:var(--brand-soft);color:var(--brand-ink)}
.pill.period{background:var(--per-soft);color:var(--per)}
.shift.period{border-left:3px solid var(--per)}
.shift.period .date .dw{color:var(--per);font-weight:600}
.kindpick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.kindpick{grid-template-columns:1fr}}
.kindpick label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:400;cursor:pointer;background:var(--surface)}
.kindpick label:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.kindpick input{margin-top:4px;accent-color:var(--brand)}
.kindpick b{display:block;font-size:14.5px}
.kindpick small{color:var(--muted);font-size:13px}
fieldset.days{border:0;padding:0;margin:0}
fieldset.days legend{font-size:13.5px;font-weight:600;margin-bottom:6px;padding:0}
.daypick{display:flex;gap:6px;flex-wrap:wrap}
.daypick label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:500;cursor:pointer}
.daypick label:has(input:checked){border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink)}
.daypick input{accent-color:var(--brand);margin:0}
#qualBox[hidden]{display:none}
#periodFields{display:grid;gap:16px}
#periodFields[hidden]{display:none}
.bar{position:relative;height:5px;background:var(--bg);border-radius:3px;margin-top:10px;max-width:300px}
.bar span{position:absolute;top:0;bottom:0;border-radius:3px}
.rate{text-align:right}
.rate b{font-size:18px;display:block;line-height:1.15;font-weight:600}
.rate small{color:var(--muted);font-size:12.5px}
@media(max-width:560px){.shift{grid-template-columns:48px 1fr;padding:14px}.rate{grid-column:2;text-align:left;display:flex;gap:8px;align-items:baseline}.rate b{display:inline}}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;font-size:14.5px;background:var(--tint)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.kpi div{font-size:13px;color:var(--muted)}
.kpi b{font-size:26px;letter-spacing:-.02em;font-weight:600;display:block;margin-top:2px}
.kpi small{font-size:12.5px;color:var(--muted)}
.kpi small.up{color:var(--ok)}

/* Charts & tables */
.weeks{display:flex;gap:18px;align-items:flex-end;height:150px;padding-top:6px}
.wk{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.wk .pair{flex:1;display:flex;gap:5px;align-items:flex-end;width:100%;justify-content:center}
.wk .pair i{display:block;width:34%;max-width:26px;border-radius:5px 5px 2px 2px}
.wk .p{background:var(--brand-soft)}
.wk .f{background:var(--brand)}
.wk span{font-size:12px;color:var(--muted)}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-top:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
.dept{min-width:760px}
.rguide{min-width:760px}
.rguide td,.rguide th{padding:9px 10px}
.rg{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;font-weight:600;font-size:13.5px;min-width:58px}
.rg:hover{border-color:var(--brand);color:var(--brand-ink)}
.rg.on{background:var(--brand);border-color:var(--brand);color:var(--on)}
.rguide th small{display:block;font-weight:500;font-size:11.5px}
.rguide td small{display:block;color:var(--muted);font-size:12px;font-weight:400}
th,td{padding:12px 14px;text-align:left;font-size:14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:600;color:var(--muted);font-size:12.5px;background:var(--tint)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.meter{display:flex;align-items:center;gap:8px}
.meter .track{flex:1;height:6px;border-radius:3px;background:var(--bg);min-width:60px;overflow:hidden}
.meter .track i{display:block;height:100%;background:var(--brand);border-radius:3px}
.split{display:flex;height:8px;border-radius:4px;overflow:hidden;min-width:110px;background:var(--bg)}
.split i:first-child{background:var(--brand)}
.split i:last-child{background:var(--late)}
.split-lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.covt{min-width:640px}
.covt td,.covt th{text-align:center;padding:9px 8px}
.covt td:first-child,.covt th:first-child{text-align:left;padding-left:14px}
.cov{display:inline-block;min-width:48px;padding:4px 8px;border-radius:7px;font-weight:600;border:0;font-size:13px}
.cov.ok{background:var(--ok-soft);color:var(--ok)}
.cov.gap{background:var(--alert-soft);color:var(--alert)}
.cov.none{color:var(--faint);font-weight:400;background:none}

.banner{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 25%,transparent);border-radius:14px;padding:14px 18px;margin-bottom:20px}
.banner p{margin:0;font-size:14.5px}
.banner b{color:var(--brand-ink)}

/* People */
.person{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.person:first-child{border-top:0}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.avatar.lg{width:54px;height:54px;font-size:17px}
.avatar{overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.hue{background:hsl(var(--h) 55% 91%);color:hsl(var(--h) 45% 30%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .avatar.hue{background:hsl(var(--h) 30% 24%);color:hsl(var(--h) 60% 82%)}}
:root[data-theme="dark"] .avatar.hue{background:hsl(var(--h) 30% 24%);color:hsl(var(--h) 60% 82%)}
.person .info{flex:1;min-width:0;font-size:14.5px}
.person .info small{display:block;color:var(--muted);font-size:13px}
.person .act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.stars{color:var(--late);letter-spacing:1px}
.scores{display:grid;gap:12px}
.score{display:grid;grid-template-columns:130px 1fr 34px;gap:12px;align-items:center;font-size:14px}

.score .track i{display:block;height:100%;background:var(--brand)}

.invite{border:1px solid var(--brand);background:var(--surface);border-radius:14px;padding:16px 18px;display:grid;gap:12px}
.invite .from{font-size:13px;color:var(--brand-ink);font-weight:600}
.invite .acts{display:flex;gap:8px;flex-wrap:wrap}
.next{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--lift)}
.next .when{font-size:13px;color:var(--muted)}
.next .big{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:2px 0}

/* Pools */
.pools{display:grid;gap:12px}
@media(min-width:720px){.pools{grid-template-columns:1fr 1fr}}
.pool{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:10px}
.pool .top-row{display:flex;justify-content:space-between;gap:10px;align-items:start}
.pool p{margin:0;font-size:13.5px;color:var(--muted)}
.creds{list-style:none;margin:0;padding:0}
.creds li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.creds li:last-child{border-bottom:0}
.creds small{display:block;color:var(--muted);font-size:13px}

/* Forms */
.form{display:grid;gap:16px;max-width:640px}
.row{display:grid;gap:14px;grid-template-columns:1fr 1fr}
@media(max-width:520px){.row{grid-template-columns:1fr}}
label{display:grid;gap:6px;font-size:13.5px;font-weight:600}
label input,label select,label textarea{padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--tint);font-weight:400;width:100%;font-size:14.5px}
.check{display:flex;gap:10px;align-items:center;font-weight:500}
.check input{width:18px;height:18px;accent-color:var(--brand)}
.inline-form{display:flex;gap:8px;flex-wrap:wrap}
.inline-form input{flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--tint)}

.overlay{position:fixed;inset:0;background:rgba(20,36,44,.35);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--surface);width:100%;max-width:580px;border-radius:20px 20px 0 0;max-height:90%;overflow:auto;padding:24px 22px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:var(--lift)}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:20px}}
.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:start}
.x{border:0;background:var(--bg);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1;flex:none;color:var(--muted)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:16px 0}
.facts div{background:var(--surface);padding:10px 12px;font-size:14px}
.facts span{display:block;color:var(--muted);font-size:12.5px}
.sheet h3{margin-top:18px}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.note{font-size:13.5px;color:var(--muted);margin:10px 0 0}
.crit{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.crit div{font-size:14.5px;font-weight:600}
.crit small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.starset{display:flex;gap:2px;flex:none}
.starset button{border:0;background:none;padding:3px;font-size:24px;line-height:1;color:var(--line)}
.starset button.on{color:var(--late)}

.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:12px;font-size:14.5px;z-index:60;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);box-shadow:var(--lift)}

.foot{max-width:1120px;margin:0 auto;padding:0 20px 32px;font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.linkish{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:12.5px}
</style>

<body>
<header class="top">

/* Suggested rate for a shift: senior level (10–19 years) by default; highest legal premium of shift time and weekday applies. */
function guideRate(quals, date, start, level=2){

/* ---------- Rate escalation ----------
   Hospital sets its rate and a maximum. The maximum is only used when nobody has applied.
   Inside the hospital's window the rate rises in two steps: halfway at the window start,
   to the maximum at half the window. Applicants only ever see the current rate. */
const daysOut = s => Math.round((parse(s.date)-today)/864e5);
const stepRate = (s,k) => k>=2 ? s.maxRate : s.baseRate + Math.round((s.maxRate-s.baseRate)/2);
const stepDay = (s,k) => k>=2 ? Math.ceil(s.win/2) : s.win;
const hasCeiling = s => s.win>0 && s.maxRate>s.baseRate;
const canRaise = s => hasCeiling(s) && !s.done && !s.closed && !s.assigned && !s.applicants.length && !s.invited.length;
function dueStep(s){ if (!hasCeiling(s)) return 0; const d = daysOut(s); return d<=stepDay(s,2) ? 2 : d<=stepDay(s,1) ? 1 : 0; }
function escalate(s, force){
  if (!canRaise(s)) return false;
  const k = force ? Math.min(2, s.step+1) : (s.auto ? dueStep(s) : 0);
  if (k<=s.step) return false;
  s.step = k; s.rate = stepRate(s,k); return true;
}
/* ---------- Invitations ----------
   One invitation per shift at a time. It is a firm offer: if the nurse accepts, the shift is hers.
   Applications stay open in parallel. Whoever is confirmed first closes every other loop automatically. */
const replyHours = s => { const d = daysOut(s); return Math.min(s.urgent ? 1 : 4, d<=1 ? 1 : d<=3 ? 2 : 4); };
/* Audience widens in stages while nobody applies: 1 = pool + returning nurses, 2 = qualified within 30 km, 3 = within 100 km. */
const AUD = ['Your staff pool only','Your pool and nurses who have worked here','All qualified nurses within 30 km','Wider radius: within 100 km'];
const visibleToMe = s => status(s.hosp,'me')==='member' || (!s.poolOnly && ((s.aud>=2 && HOSPITALS[s.hosp].km<=30) || (s.aud>=3 && HOSPITALS[s.hosp].km<=100)));
const who2 = (s,n) => s.role==='Midwife' ? (n===1?'midwife':'midwives') : (n===1?'nurse':'nurses');
const availFor = s => Object.keys(S.avail).filter(id=>S.avail[id] && id!=='me' && fits(id,s));
const canSplit = s => s.split && dur(s) >= 10;
const fmt = m => `${String(Math.floor(m/60)%24).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
function fill(s, id, how){
  const others = s.applicants.filter(x=>x!==id), inv = s.invited.find(x=>x!==id);
  s.prevApps = others; s.assigned = id; s.applicants = []; s.invited = []; s.queue = []; s.alerted = false; s.reconf = daysOut(s)<=1 ? 'pending' : null;
  const extra = `${inv?` The invitation to ${P(inv).name} was withdrawn and they've been told.`:''}${others.length?` ${others.length} other applicant${others.length===1?' was':'s were'} told it's filled.`:''}`;
  return extra;
}
function tryAuto(s, id){

}
function advanceQueue(s){

}
function chaseStep(s){

}
function splitShift(s){
  const a = mins(s.start), half = Math.round(dur(s)*30), mid = (a + half) % 1440;
  const base = {...s, applicants:[], invited:[], queue:[], assigned:null, prevApps:[], urgent:true, aud:3, alerted:false, split:false, closed:false, step:0};
  const d2 = mid < a ? iso(new Date(parse(s.date).getTime()+864e5)) : s.date;
  const one = {...base, id:'s'+(nextId++), end:fmt(mid)}, two = {...base, id:'s'+(nextId++), start:fmt(mid), date:d2};
  s.closed = true; S.shifts.push(one, two); return [one, two];
}
const hhmm = ms => new Date(ms).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const invitee = s => s.invited[0];
function sendInvite(s, id){ s.invited = [id]; s.inviteExp = Date.now() + replyHours(s)*36e5; if (s.queue) s.queue = s.queue.filter(x=>x!==id); }
function withCeilings(list){
  list.forEach(s=>{ s.baseRate=s.rate; s.maxRate=s.rate; s.win=0; s.step=0; s.auto=true; });
  const set = (id,max,win) => { const s = list.find(x=>x.id===id); if (s){ s.maxRate=max; s.win=win; } };
  /* Ceilings: about 15% above the posted rate, inside a 3–5 day window. */
  [['s1',3],['s2',3],['s3',3],['s7',5],['s9',3],['s21',3],['s24',3],['s11',3],['s14',3],['s17',4]].forEach(([id,win])=>{ const s = list.find(x=>x.id===id); if (s) set(id, Math.round(s.rate*1.15), win); });
  list.forEach(s=>{
    s.queue = []; s.prevApps = []; s.split = s.hosp===HOSP && dur(s)>=10; s.closed = false;
    escalate(s);
    s.aud = s.poolOnly ? 0 : (s.step>0 || HOSPITALS[s.hosp].km>30) ? 3 : 2;
    if (s.invited.length) s.inviteExp = Date.now() + replyHours(s)*36e5;
    const open = !s.done && !s.assigned && !s.applicants.length && !s.invited.length;
    s.alerted = open && !s.poolOnly && daysOut(s)<=1 && (!hasCeiling(s) || s.step===2);
    s.reconf = s.assigned && !s.done && daysOut(s)<=1 ? (s.assigned==='me' ? 'pending' : 'yes') : null;
  });
  const s4 = list.find(x=>x.id==='s4'); if (s4) s4.prevApps = ['karim'];
  return list;
}
function coverPanel(s){
  const rule = S.rules[s.ward];
  const aud = s.poolOnly ? `<p class="note" style="margin-top:0">Only your staff pool can see this shift (your choice when posting).</p>`
    : `<ol class="ladder">${[1,2,3].map(k=>`<li class="${s.aud===k?'on':''}"><span>${k===1?'At posting':k===2?'If nobody applies':'Still nobody'}</span><b>${AUD[k]}</b></li>`).join('')}</ol>`;
  const alert = s.alerted ? `<div class="banner" style="margin:14px 0"><p><b>24 hours to go and still open.</b> ${availFor(s).length} ${who2(s,availFor(s).length)} marked available today ${availFor(s).length===1?'was':'were'} messaged. Choose what happens next.</p>
      <div class="acts" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary small" data-act="raisemax" data-id="${s.id}">Raise maximum by €5</button>${canSplit(s)?`<button class="btn small" data-act="split" data-id="${s.id}">Split into two halves</button>`:''}<button class="btn small quiet" data-act="internal" data-id="${s.id}">We'll cover it internally</button></div></div>` : '';
  const more = !s.assigned && !s.applicants.length && !s.invited.length && (!s.alerted);
  return `${alert}<h3>Who can see it</h3>${aud}${rateRules(s)}
    ${rule&&rule.on?`<p class="note">Auto-confirm is on for ${esc(s.ward)}: pool members rated ${rule.min}+ are confirmed as soon as they apply.</p>`:''}
    ${canSplit(s)&&!s.alerted?`<p class="note">If still open 24 hours before, this ${dur(s)}-hour shift can be offered as two halves.</p>`:''}
    ${more?`<div class="actions" style="margin-top:6px"><button class="btn small quiet" data-act="chase" data-id="${s.id}">Demo: nobody yet, move the chase forward</button></div>`:''}`;
}
function rateRules(s){
  if (!hasCeiling(s)) return `<h3>Rate</h3><p class="note" style="margin-top:0">No maximum set. The rate stays at €${s.baseRate}/h.</p>`;
  const li = (on,label,v) => `<li class="${on?'on':''}"><span>${label}</span><b class="num">€${v}/h <small style="font-weight:500;color:var(--muted)">· final ${eur2(charged(v))}</small></b></li>`;
  const held = !s.assigned && (s.applicants.length || s.invited.length) && s.step<2;
  return `<h3>Rate and your maximum</h3><ol class="ladder">
      ${li(s.step===0,'Posted rate',s.baseRate)}
      ${li(s.step===1,`If nobody has applied ${stepDay(s,1)} day${stepDay(s,1)===1?'':'s'} before`,stepRate(s,1))}
      ${li(s.step===2,`If still nobody ${stepDay(s,2)} day${stepDay(s,2)===1?'':'s'} before (your maximum)`,s.maxRate)}
    </ol>
    <p class="note">${held?'Rising is paused: someone has applied or been invited. ':''}Your maximum is only used if nobody takes the shift at your rate. Applicants only ever see the current rate, never your maximum. You're notified each time it rises.</p>
`;
}

function fresh(){ return { shifts:withCeilings(shiftsSeed()), people:peopleSeed(), pools:poolsSeed(), hist:historySeed(),
  rules:Object.fromEntries(WARDS.map(w=>[w,{on:w==='Intensive care',min:4.5}])),
  avail:{me:false,karim:true,nadia:true,bart:true,koen:true,fatima:true,amina:false},
  role:'intro', tab:{staff:'dash',hosp:'dash'}, f:{city:'all',cat:'all',role:'all',type:'all',kind:'all'}, prompted:false }; }
let S = fresh(), nextId = 100, draft = {};

const P = id => S.people[id];
const poolOf = h => S.pools[h] || {members:[],requests:[]};
const status = (h,id) => poolOf(h).members.includes(id) ? 'member' : poolOf(h).requests.includes(id) ? 'pending' : 'none';
const fits = (id, s) => P(id).role===s.role && s.quals.every(q=>P(id).quals.includes(q));
const upcoming = s => !s.done && !s.closed && (s.endDate||s.date) >= TODAY;
const isPeriod = s => s.kind==='period';
const DAYN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const short = x => x.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const mon = x => x.toLocaleDateString('en-GB',{month:'short'});
const daysLabel = days => { const k = [...days].sort().join(); if (k==='1,2,3,4,5') return 'Mon–Fri'; if (k==='0,1,2,3,4,5,6') return 'Every day'; if (k==='0,6') return 'Weekends'; return [1,2,3,4,5,6,0].filter(n=>days.includes(n)).map(n=>DAYN[n]).join(', '); };
const weeksOf = s => Math.max(1, Math.round((parse(s.endDate)-parse(s.date))/864e5/7));
const occ = s => { let n=0; const e=parse(s.endDate); for (let x=parse(s.date); x<=e; x.setDate(x.getDate()+1)) if (s.days.includes(x.getDay())) n++; return n; };
const total = s => isPeriod(s) ? occ(s)*dur(s)*s.rate : dur(s)*s.rate;
const whenTxt = s => isPeriod(s) ? `${short(parse(s.date))} – ${short(parse(s.endDate))}` : rel(s);
const whenLong = s => isPeriod(s) ? `${short(parse(s.date))} – ${short(parse(s.endDate))} · ${daysLabel(s.days)}, ${s.start}–${s.end}` : `${nice(parse(s.date))}, ${s.start}–${s.end}`;
const REASONS = ['Maternity leave cover','Parental leave cover','Long-term sick leave','Holiday cover','Vacancy until hired','Training or secondment'];
const CONTRACTS = ['Self-employed'];
const pendingEvals = () => S.shifts.filter(s=>s.hosp===HOSP && s.done && !s.evaluated).sort(byTime);
const myInvites = () => S.shifts.filter(s=>upcoming(s) && !s.assigned && s.invited.includes('me')).sort(byTime);
const stars = v => `<span class="stars" aria-label="${v.toFixed(1)} out of 5">★</span> <span class="num">${v.toFixed(1)}</span>`;

function bar(s, big){
  const a = mins(s.start), b = mins(s.end), c = TC[type(s)];
  const segs = b > a ? [[a,b]] : [[a,1440],[0,b]];
  return `<div class="bar" ${big?'style="max-width:none;height:8px"':''} aria-hidden="true">${segs.map(([x,y])=>`<span style="left:${x/14.4}%;width:${(y-x)/14.4}%;background:${c}"></span>`).join('')}</div>`
    + (big ? `<div class="hours num"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div>` : '');
}

function card(s, ctx){
  const d = parse(s.date), h = HOSPITALS[s.hosp], t = type(s), per = isPeriod(s);
  let tags = per ? `<span class="pill period">Period · ${weeksOf(s)} week${weeksOf(s)===1?'':'s'}</span><span class="pill muted">${esc(s.reason)}</span>` : `<span class="pill ${t}">${TL[t]}</span>`;
  tags += qualPills(s);
  if (s.urgent && !s.assigned) tags += `<span class="pill urgent">Urgent</span>`;
  if (ctx==='staff'){
    if (status(s.hosp,'me')==='member') tags += `<span class="pill brand">Your pool</span>`;
    if (s.assigned==='me') tags += s.reconf==='pending' ? `<span class="pill urgent">Reconfirm by tonight</span>` : `<span class="pill ok">${s.reconf==='yes'?'Reconfirmed':'Confirmed'}</span>`;
    else if (s.invited.includes('me')) tags += `<span class="pill brand">Invitation</span>`;
    else if (s.applicants.includes('me')) tags += `<span class="pill muted">Applied</span>`;
  } else {
    if (s.poolOnly && !s.assigned) tags += `<span class="pill brand">Pool only</span>`;
    if (s.assigned) tags += `<span class="pill ok">${esc(P(s.assigned).name)}</span>${s.reconf==='pending'?'<span class="pill muted">Awaiting reconfirmation</span>':s.reconf==='yes'?'<span class="pill muted">Reconfirmed</span>':''}`;
    else {
      if (s.applicants.length) tags += `<span class="pill muted">${s.applicants.length} applicant${s.applicants.length===1?'':'s'}</span>`;
      if (s.invited.length) tags += `<span class="pill brand">Invited: ${esc(P(invitee(s)).name.split(' ')[0])} · reply by ${hhmm(s.inviteExp)}</span>`;
      if (!s.applicants.length && !s.invited.length) tags += `<span class="pill muted">No applicants yet</span>`;
      if (s.alerted) tags += `<span class="pill urgent">Needs a decision</span>`;
      if (hasCeiling(s)) tags += s.step ? `<span class="pill brand">Raised from €${s.baseRate} · max €${s.maxRate}</span>` : `<span class="pill muted">Max €${s.maxRate}</span>`;
    }
  }
  const where = ctx==='staff' ? `${esc(s.hosp)}, ${h.city} · ${h.km} km` : esc(s.ward);
  const sched = per ? `<div class="where num">${short(d)} → ${short(parse(s.endDate))} · ${daysLabel(s.days)}, ${s.start}–${s.end}</div>` : '';
  return `<button class="shift${per?' period':''}" data-act="open" data-id="${s.id}">
    <div class="date"><div class="dn num">${d.getDate()}</div><div class="dw">${per?mon(d)+' →':wk(d)}</div></div>
    <div class="meta"><h3>${esc(s.role)}${ctx==='staff'?' · '+esc(s.ward):''}</h3><div class="where">${where}</div>${sched}
      <div class="tags">${tags}</div>${per?'':bar(s)}</div>
    <div class="rate num"><b>€${s.rate}/h</b><small>${per?`${dur(s)*s.days.length} h/week`:`${s.start}–${s.end}`}</small>${ctx==='hosp'?`<small style="display:block">final ${eur2(charged(s.rate))}/h</small>`:''}</div>
  </button>`;
}

/* ---------- Staff views ---------- */
function staffDash(){
  const me = P('me');

/* ---------- Hospital metrics ---------- */
function metrics(){
  const H = S.hist;
  const agg = rows => {
    const f = rows.filter(r=>r.filled), ret = f.filter(r=>r.staff!=='new');
    return {posted:rows.length, filled:f.length, rate:rows.length?f.length/rows.length:0,
      ttf:f.length?f.reduce((t,r)=>t+r.ttf,0)/f.length:0, ret:f.length?ret.length/f.length:0,
      rating:f.length?f.reduce((t,r)=>t+r.rating,0)/f.length:0, cost:f.reduce((t,r)=>t+r.cost,0),
      urgent:rows.length?rows.filter(r=>r.ttf!==null&&r.ttf<3).length/rows.length:0};
  };
  const dept = WARDS.map(w=>({ward:w,...agg(H.filter(r=>r.ward===w))}));
  const weeks = [3,2,1,0].map(k=>{ const rows = H.filter(r=>r.back>k*7 && r.back<=(k+1)*7); return {label:k===0?'This week':k+'w ago',posted:rows.length,filled:rows.filter(r=>r.filled).length}; });
  return {all:agg(H), dept, weeks};
}

  return `<div class="head"><div><h2>Post a shift</h2><p class="sub">Set the rate you want to pay and the most you would pay if nobody applies. Pool-only posts go to your members first.</p></div></div>
  <form class="form panel" id="postForm">
    <input type="hidden" name="kind" value="shift">
    <div class="row"><label>Department<select name="ward">${WARDS.map(w=>`<option>${w}</option>`).join('')}</select></label>
      <label>Profession<select name="role">${roleOptions('Nurse')}</select></label></div>
    <fieldset class="days" id="qualBox" style="border:0;padding:0;margin:0"><legend style="font-weight:600;font-size:14px;padding:0;margin-bottom:6px">Required qualifications <small style="color:var(--muted);font-weight:500">(leave all unchecked for a general care nurse)</small></legend><div style="display:grid;gap:8px">${Object.entries(QUALS).map(([k,q])=>`<label class="check"><input type="checkbox" name="quals" value="${k}" ${k==='icu'?'checked':''}> ${q.label}</label>`).join('')}</div></fieldset>
    <div class="hint" id="reqHint"><b>Checked before anyone can apply</b>${reqList('Nurse',['icu'])}</div>
    <div class="row"><label><span id="dateLbl">${pk?'Start date':'Date'}</span><input type="date" name="date" required min="${TODAY}" value="${iso(dayAt(pk?7:1))}"></label>
      <label>Start raising the rate<select name="win"><option value="0">Never, keep my rate</option><option value="7">7 days before</option><option value="5">5 days before</option><option value="3" selected>3 days before</option><option value="2">2 days before</option></select></label></div>
    <div id="rguideBox">${rateGuide(['icu'])}</div>
    <div class="hint" id="refBox" style="background:var(--brand-soft);border-color:transparent;color:var(--ink)">${refNote(['icu'],iso(dayAt(1)),'14:00')}</div>
    <div class="row"><label>Nurse's rate: what the nurse earns (€ per hour)<input type="number" name="rate" min="15" max="150" value="${guideRate(['icu'],iso(dayAt(1)),'14:00')}" required></label>
      <label>Nurse's maximum rate (€ per hour)<input type="number" name="maxRate" min="15" max="200" value="${Math.round(guideRate(['icu'],iso(dayAt(1)),'14:00')*1.15)}" required></label></div>
    <div class="hint" id="costBox" style="background:var(--brand-soft);border-color:transparent;color:var(--ink)">${costSummary(guideRate(['icu'],iso(dayAt(1)),'14:00'),Math.round(guideRate(['icu'],iso(dayAt(1)),'14:00')*1.15),8)}</div>
    <div class="hint"><b>The maximum is only used if nobody takes the shift at your rate.</b> Inside the window you choose, the rate rises in two steps: halfway first, then to your maximum. It stops rising as soon as someone applies, and you're notified each time it changes. Applicants only ever see the current rate.</div>
    <div class="row"><label><span id="startLbl">${pk?'Daily start':'Start'}</span><input type="time" name="start" value="${pk?'07:00':'14:00'}" required></label>
      <label><span id="endLbl">${pk?'Daily end':'End'}</span><input type="time" name="end" value="${pk?'15:00':'22:00'}" required></label></div>
    <label>Who can see this<select name="vis"><option value="widen">My pool first, then widen automatically</option><option value="pool">Only my staff pool</option><option value="all">All qualified nurses straight away</option></select></label>
    <label class="check"><input type="checkbox" name="split" checked> If still open 24 hours before, allow splitting a 10-hour-plus shift into two halves</label>
    <label>Notes for applicants<textarea name="notes" rows="3" placeholder="e.g. 12-bed unit, handover with the colleague on leave in the first week"></textarea></label>
    <label class="check"><input type="checkbox" name="urgent"> Mark as urgent (shown first to nurses)</label>
    <div class="actions" style="margin-top:0"><button class="btn primary" type="submit" id="postBtn">${pk?'Post period':'Post shift'}</button><button class="btn quiet" type="button" data-act="tab" data-v="shifts">Cancel</button></div>

/* ---------- Modals ---------- */
function sheet(inner){ document.getElementById('modal').innerHTML = `<div class="overlay" data-act="backdrop"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt">${inner}</div></div>`;
  const b = document.querySelector('.sheet .btn.primary') || document.querySelector('.sheet .x'); b && b.focus(); }
const closeModal = () => document.getElementById('modal').innerHTML = '';
const personRow = (id, right, extra='', s) => { const p=P(id);
  const dept = s ? S.hist.filter(r=>r.staff===id && r.ward===s.ward).length + S.shifts.filter(x=>x.hosp===HOSP&&x.done&&x.assigned===id&&x.ward===s.ward).length : 0;
  const here = workedHere(id);
  return `<div class="person">${avatar(p)}<div class="info"><b>${p.name}</b> ${extra}<small>${expTxt(p)} · ${who(p)}${s&&s.quals.length?' <span style="color:var(--ok);font-weight:600">✓ meets requirements</span>':''}</small>
    <small>${stars(overall(p))} from ${p.n} reviews · ${here?`worked here ${here}×${s?`, ${dept} in ${esc(s.ward)}`:''}`:'new to your hospital'} · ${relTxt(p)} · ${p.langs}</small></div><div class="act">${right}</div></div>`; };

function openShift(id){
  const s = S.shifts.find(x=>x.id===id); if (!s) return;
  const h = HOSPITALS[s.hosp], t = type(s), d = parse(s.date);
  let body = '';
  if (S.role==='staff'){
    let act;
    if (s.done) act = `<span class="pill ok" style="font-size:13px;padding:5px 12px">Completed</span>`;
    else if (s.assigned==='me') act = s.reconf==='pending'
      ? `<button class="btn primary" data-act="reconfirm" data-id="${s.id}">Reconfirm I'll be there</button><button class="btn quiet" data-act="cancel" data-id="${s.id}">I can't make it</button><p class="note" style="flex-basis:100%">Your shift is within 24 hours. Please reconfirm so the department can count on you.</p>`
      : `<span class="pill ok" style="font-size:13px;padding:5px 12px">${s.reconf==='yes'?'Reconfirmed':"You're confirmed for this shift"}</span><button class="btn quiet" data-act="cancel" data-id="${s.id}">I can't make it</button>`;
    else if (s.assigned) act = `<span class="pill muted" style="font-size:13px;padding:5px 12px">This shift has been filled</span>`;
    else if (s.invited.includes('me')) act = `<button class="btn primary" data-act="accept" data-id="${s.id}">${isPeriod(s)?'Accept period':'Accept shift'}</button><button class="btn" data-act="decline" data-id="${s.id}">Decline</button>`;
    else if (s.applicants.includes('me')) act = `<button class="btn" data-act="withdraw" data-id="${s.id}">Withdraw application</button><p class="note" style="flex-basis:100%">The hospital usually replies within a few hours.</p>`;
    else act = `<button class="btn primary" data-act="apply" data-id="${s.id}">${isPeriod(s)?'Apply for period':'Apply for shift'}</button><button class="btn quiet" data-act="close">Not now</button>`;
    body = `${s.invited.includes('me')&&!s.assigned?`<p class="note" style="margin-top:0;color:var(--brand-ink)">${esc(s.hosp)} invited you directly from their pool. Only you have this invitation: accept by ${hhmm(s.inviteExp)} and the shift is yours.</p>`:''}
      <h3 style="margin-top:0">Requirements</h3>${reqList(s.role,s.quals)}${s.notes?`<p class="note">${esc(s.notes)}</p>`:''}<div class="actions">${act}</div>`;
  } else if (s.done){
    body = `<h3>Worked by</h3>${personRow(s.assigned, s.evaluated?'<span class="pill ok">Evaluated</span>':`<button class="btn small primary" data-act="eval" data-id="${s.id}">Evaluate</button>`)}`;
  } else if (s.assigned){
    const rc = s.reconf==='yes' ? '<span class="pill ok">Reconfirmed</span>' : s.reconf==='pending' ? '<span class="pill muted">Awaiting reconfirmation</span>' : '<span class="pill ok">Confirmed</span>';
    body = `<h3>Confirmed</h3>${personRow(s.assigned, rc)}
      <p class="note">${daysOut(s)<=1?'The nurse reconfirms 24 hours before the shift; you are warned if she doesn\'t.':'The nurse will be asked to reconfirm 24 hours before the shift.'} If she cancels, the shift is republished as urgent and earlier applicants hear first.</p>
      ${s.assigned!=='me'?`<div class="actions" style="margin-top:6px"><button class="btn small quiet" data-act="cancel" data-id="${s.id}">Demo: the nurse cancels</button></div>`:''}`;
  } else {
    const pool = poolOf(HOSP).members;
    const tag = id => pool.includes(id) ? '<span class="pill brand">In your pool</span>' : workedHere(id) ? '<span class="pill muted">Returning</span>' : '<span class="pill muted">New</span>';
    const inviteAll = pool.filter(id=>!s.applicants.includes(id)&&!s.invited.includes(id)&&!(s.queue||[]).includes(id)&&fits(id,s)).sort((a,b)=>overall(P(b))-overall(P(a)));
    const inviteable = inviteAll.slice(0,8), moreN = inviteAll.length - inviteable.length;
    const moreNote = moreN>0 ? `<p class="note">Showing your 8 highest-rated matches. ${moreN} more qualified ${moreN===1?'person':'people'} in your pool.</p>` : '';
    const q = s.queue || [];
    body = `${coverPanel(s)}<h3>Requirements</h3>${reqList(s.role,s.quals)}<h3>Applicants</h3>${s.applicants.map(a=>personRow(a,`<button class="btn primary small" data-act="confirm" data-id="${s.id}" data-staff="${a}">Confirm</button>`,tag(a),s)).join('') || `<p class="note">${s.poolOnly?'This shift is only visible to your pool.':'No applicants yet. Nearby verified professionals have been notified.'}</p>`}
      ${s.invited.length
        ? `<h3>Invitation out</h3>${personRow(invitee(s),`<button class="btn small quiet" data-act="uninvite" data-id="${s.id}">Withdraw</button>`,tag(invitee(s)))}
           <p class="note">Reply due by ${hhmm(s.inviteExp)} (${replyHours(s)} h${s.urgent?', urgent':''}). If ${P(invitee(s)).name.split(' ')[0]} accepts, the shift is theirs and applicants are told it's filled. If they decline or don't answer, you can invite someone else. Applications stay open meanwhile; confirming an applicant withdraws the invitation automatically.</p>
           <div class="actions" style="margin-top:6px"><button class="btn small quiet" data-act="expire" data-id="${s.id}">Demo: let the invitation run out</button><button class="btn small quiet" data-act="refuse" data-id="${s.id}">Demo: they decline</button></div>
           <h3>Invite queue</h3><p class="note" style="margin-top:0">If the invitation lapses or is declined, the next person is invited automatically. Up to 3.</p>
           ${q.map((a,i)=>personRow(a,`<button class="btn small quiet" data-act="unqueue" data-id="${s.id}" data-staff="${a}">Remove</button>`,`<span class="pill brand">#${i+1}</span>`)).join('')}
           ${q.length<3 ? inviteable.map(a=>personRow(a,`<button class="btn small" data-act="queue" data-id="${s.id}" data-staff="${a}">Add to queue</button>`)).join('') : ''}`
        : `<h3>Invite from your pool</h3><p class="note" style="margin-top:0">One person at a time. The invitation is a firm offer: if they accept, the shift is theirs.</p>${inviteable.map(a=>personRow(a,`<button class="btn small" data-act="invite" data-id="${s.id}" data-staff="${a}">Invite</button>`)).join('')+moreNote || '<p class="note">No one else in your pool has the required qualifications. Applications from the market stay open.</p>'}`}`;
  }
  sheet(`<div class="sheet-head"><div><h2 id="mt">${esc(s.role)} · ${esc(s.ward)}</h2><div class="sub" style="margin:0">${esc(s.hosp)}, ${h.area}, ${h.city}</div></div><button class="x" data-act="close" aria-label="Close">×</button></div>
    <div class="tags" style="margin-top:10px">${isPeriod(s)?`<span class="pill period">Period · ${weeksOf(s)} weeks</span><span class="pill muted">${esc(s.reason)}</span>`:`<span class="pill ${t}">${TL[t]} shift</span>`}${s.urgent&&!s.assigned?'<span class="pill urgent">Urgent</span>':''}${s.poolOnly&&!s.assigned?'<span class="pill brand">Pool only</span>':''}</div>
    <div style="margin-top:14px">${bar(s,true)}</div>
    ${isPeriod(s)?`<div class="facts"><div><span>Period</span>${short(d)} – ${short(parse(s.endDate))} ${parse(s.endDate).getFullYear()}</div><div><span>Schedule</span>${daysLabel(s.days)}, <span class="num">${s.start}–${s.end}</span></div>
      <div><span>Hours per week</span><b class="num">${dur(s)*s.days.length} h</b> · ${occ(s)} shifts</div><div><span>Contract</span>${esc(s.contract)}</div>
      <div><span>Rate</span><b class="num">€${s.rate}</b> per hour</div><div><span>Estimated total</span><b class="num">${eur(total(s))}</b></div></div>
      <p class="note" style="margin-top:-6px">One person covers the whole period. The hospital evaluates after the first week and at the end.</p>`
    :`<div class="facts"><div><span>Date</span>${nice(d)}</div><div><span>Hours</span><span class="num" style="color:var(--ink);font-size:14px;display:inline">${s.start}–${s.end} (${dur(s)} h)</span></div>
      ${S.role==='hosp'
        ? `<div><span>Nurse's rate</span><b class="num">€${s.rate}</b> per hour${s.step?` <small style="color:var(--muted)">(posted at €${s.baseRate})</small>`:''}</div><div><span>Final price per hour (fee + VAT incl.)</span><b class="num">${eur2(charged(s.rate))}</b> per hour</div>
           <div><span>Nurse's pay for the shift</span><b class="num">${eur2(dur(s)*s.rate)}</b></div><div><span>Final price for the shift</span><b class="num">${eur2(charged(s.rate)*dur(s))}</b></div></div>`
        : `<div><span>Your rate</span><b class="num">€${s.rate}</b> per hour</div><div><span>You earn for the shift</span><b class="num">${eur(dur(s)*s.rate)}</b></div></div>
           <p class="note" style="margin-top:-6px">The rate you see is what you earn. eWard's fee is paid by the hospital.</p>`}`}${body}`);
}

function openInvitePick(staff){
  const p = P(staff);
  const list = S.shifts.filter(s=>s.hosp===HOSP&&upcoming(s)&&!s.assigned&&!s.invited.length&&!s.applicants.includes(staff)&&fits(staff,s)).sort(byTime);
  sheet(`<div class="sheet-head"><div><h2 id="mt">Invite ${p.name}</h2><div class="sub" style="margin:0">${p.yrs} yrs · ${levelOf(p.yrs)} · ${who(p)} · ${stars(overall(p))}</div></div><button class="x" data-act="close" aria-label="Close">×</button></div>
    <p class="note">Choose an open shift. ${p.name.split(' ')[0]} gets a direct invitation and can accept it in one tap. Shifts that already have an invitation out aren't listed.</p>
    ${list.map(s=>`<div class="person"><div class="info"><b>${esc(s.role)} · ${esc(s.ward)}</b><small>${isPeriod(s)?'Period · ':''}${whenLong(s)} · €${s.rate}/h</small></div><button class="btn small primary" data-act="invite" data-id="${s.id}" data-staff="${staff}" data-back="pick">Invite</button></div>`).join('') || '<div class="empty" style="margin-top:12px">No open shifts for this role. Post a shift first.</div>'}`);
}

function openEval(id){
  const s = S.shifts.find(x=>x.id===id), p = P(s.assigned);
  draft = {id}; const left = pendingEvals().length;
  const inPool = status(HOSP, s.assigned)==='member';
  sheet(`<div class="sheet-head"><div><h2 id="mt">How did ${p.name.split(' ')[0]} do?</h2><div class="sub" style="margin:0">${esc(s.role)}, ${esc(s.ward)} · ${rel(s)}, ${s.start}–${s.end}</div></div><button class="x" data-act="close" aria-label="Evaluate later">×</button></div>
    <p class="note">${left>1?`${left} evaluations waiting. `:''}Your ratings are shared with ${p.name.split(' ')[0]} as an average only, never per hospital.</p>
    <div style="margin-top:14px">${params(s.role).map(([k,l,hint])=>`<div class="crit"><div>${l}<small>${hint}</small></div><div class="starset" role="radiogroup" aria-label="${l}">${[1,2,3,4,5].map(v=>`<button type="button" data-act="star" data-k="${k}" data-v="${v}" role="radio" aria-checked="false" aria-label="${v} of 5">★</button>`).join('')}</div></div>`).join('')}</div>
    <label style="margin-top:14px">Comment for your team (optional)<textarea id="evalNote" rows="2" placeholder="e.g. Great with ventilated patients"></textarea></label>
    ${inPool?'':`<label class="check" style="margin-top:12px"><input type="checkbox" id="evalPool"> Add ${p.name.split(' ')[0]} to your staff pool</label>`}
    <div class="actions"><button class="btn primary" data-act="submiteval">Submit evaluation</button><button class="btn quiet" data-act="close">Later</button></div>`);
}

/* ---------- Toast ---------- */
let tt;
function toast(msg){ const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(()=>el.classList.remove('show'),3400); }

/* ---------- Render ---------- */
function render(){
  document.getElementById('sw-staff').setAttribute('aria-pressed', S.role==='staff');
  document.getElementById('sw-hosp').setAttribute('aria-pressed', S.role==='hosp');
  document.getElementById('who').textContent = S.role==='staff' ? '· Sofie Peeters' : S.role==='hosp' ? '· '+HOSP : '';
  const tabs = document.getElementById('tabs');
  const T = (list,cur) => list.map(([k,l,n,c])=>`<button data-act="tab" data-v="${k}" class="${cur===k?'on':''}">${l}${n?`<span class="badge ${c||''} num">${n}</span>`:''}</button>`).join('');
  if (S.role==='staff') tabs.innerHTML = T([['dash','Dashboard',myInvites().length],['find','Find work'],['mine','My shifts'],['pools','Pools'],['profile','Profile']],S.tab.staff);
  else if (S.role==='hosp'){
    const req = poolOf(HOSP).requests.length, ap = S.shifts.filter(s=>s.hosp===HOSP&&upcoming(s)&&!s.assigned).reduce((t,s)=>t+s.applicants.length,0);
    tabs.innerHTML = T([['dash','Dashboard',pendingEvals().length,'alert'],['shifts','Shifts',ap],['pool','Staff pool',req],['post','Post a shift']],S.tab.hosp);
  } else tabs.innerHTML = '';
  const app = document.getElementById('app');
  if (S.role==='intro') app.innerHTML = intro();
  else if (S.role==='staff') app.innerHTML = ({dash:staffDash,find:staffFind,mine:staffMine,pools:staffPools,profile:staffProfile})[S.tab.staff]();
  else app.innerHTML = ({dash:hospDash,shifts:hospShifts,pool:hospPool,post:hospPost})[S.tab.hosp]();
}

function scheduleAccept(s, id){
  setTimeout(()=>{ if (!s.assigned && s.invited.includes(id)){ const extra = fill(s, id); render(); if (document.querySelector('.sheet')) openShift(s.id); toast(`${P(id).name} accepted your invitation for ${whenTxt(s)}.${extra}`); } }, 8000);
}

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v, id = el.dataset.id, st = el.dataset.staff;
  const s = id ? S.shifts.find(x=>x.id===id) : null;
  if (a==='backdrop' && e.target!==el) return;
  switch(a){
    case 'role': S.role=v; closeModal(); render(); window.scrollTo(0,0);
      if (v==='hosp' && !S.prompted && pendingEvals().length){ S.prompted=true; setTimeout(()=>openEval(pendingEvals()[0].id),450); }
      break;
    case 'tab': if (v==='post') postKind='shift'; S.tab[S.role]=v; closeModal(); render(); window.scrollTo(0,0); break;
    case 'ftype': S.f.type=v; render(); break;
    case 'fkind': S.f.kind=v; render(); break;
    case 'postperiod': postKind='period'; S.tab.hosp='post'; closeModal(); render(); window.scrollTo(0,0); break;
    case 'open': openShift(id); break;
    case 'close': case 'backdrop': closeModal(); break;
    case 'apply': s.applicants.push('me'); closeModal(); if (!tryAuto(s,'me')){ render(); toast(`Applied to ${s.ward} at ${s.hosp}`); } break;
    case 'withdraw': s.applicants=s.applicants.filter(x=>x!=='me'); closeModal(); render(); toast('Application withdrawn'); break;
    case 'accept': if (s.assigned){ closeModal(); render(); toast('This shift has already been filled.'); break; }
      fill(s,'me'); closeModal(); render(); toast(`Confirmed: ${s.ward} at ${s.hosp}, ${whenTxt(s)}. `); break;
    case 'decline': s.invited=s.invited.filter(x=>x!=='me'); advanceQueue(s); closeModal(); render(); toast('Invitation declined. The hospital has been told.'); break;
    case 'confirm': { const extra = fill(s, st); closeModal(); render(); toast(`${P(st).name} confirmed for ${whenTxt(s)}.${extra}`); break; }
    case 'uninvite': { const inv = s.invited[0]; s.invited=[]; render(); openShift(id); toast(`Invitation to ${P(inv).name} withdrawn. They've been told.`); break; }
    case 'expire': { const inv = s.invited[0]; s.invited=[]; const nx = advanceQueue(s); render(); openShift(id); toast(`${P(inv).name} didn't answer in time. The invitation lapsed.${nx||' You can invite someone else.'}`); break; }
    case 'refuse': { const inv = s.invited[0]; s.invited=[]; const nx = advanceQueue(s); render(); openShift(id); toast(`${P(inv).name} declined.${nx||' You can invite someone else.'}`); break; }
    case 'queue': if (!s.queue.includes(st) && s.queue.length<3){ s.queue.push(st); } openShift(id); toast(`${P(st).name} added to your invite queue (#${s.queue.length}).`); break;
    case 'unqueue': s.queue = s.queue.filter(x=>x!==st); openShift(id); break;
    case 'chase': case 'raise': { const m = chaseStep(s); render(); openShift(id); if (m) toast(m); break; }
    case 'raisemax': s.maxRate += 5; s.rate = s.maxRate; s.step = 2; s.alerted = false; render(); openShift(id); toast(`Maximum raised to €${s.maxRate}/h and applied. Qualified nurses nearby were notified again.`); break;
    case 'split': { const [a,b] = splitShift(s); closeModal(); render(); toast(`Split into ${a.start}–${a.end} and ${b.start}–${b.end}, both published as urgent.`); break; }
    case 'internal': s.closed = true; closeModal(); render(); toast('Marked as covered internally. The shift was withdrawn and anyone interested was told.'); break;
    case 'reconfirm': s.reconf='yes'; closeModal(); render(); toast(`Reconfirmed. ${s.hosp} has been told you'll be there.`); break;
    case 'cancel': { const who0 = s.assigned, prev = (s.prevApps||[]).filter(x=>x!==who0);
      if (who0==='me' && daysOut(s)<=2) P('me').late = (P('me').late||0)+1;
      s.assigned=null; s.reconf=null; s.urgent=true; s.aud=3; s.alerted=false; s.applicants=[]; closeModal(); render();
      toast(who0==='me' ? `Cancelled. The shift was republished as urgent${daysOut(s)<=2?' and a late cancellation was recorded on your reliability score':''}.` : `${P(who0).name} cancelled. The shift was republished as urgent${prev.length?` and ${prev.map(x=>P(x).name.split(' ')[0]).join(', ')}, who applied earlier, heard first`:''}.`);
      const back = prev.find(x=>x!=='me' && fits(x,s));
      if (back) setTimeout(()=>{ if (!s.assigned && !s.applicants.includes(back)){ s.applicants.push(back); if (!tryAuto(s, back)){ render(); toast(`${P(back).name} applied again for ${s.ward}, ${whenTxt(s)}.`); } } }, 6000);
      break; }
    case 'invite': if (s.invited.length && s.invited[0]!==st){ toast(`${P(s.invited[0]).name} already has the invitation. Withdraw it or wait for their answer.`); break; }
      sendInvite(s, st); render(); toast(`Invitation sent to ${P(st).name}. Reply due by ${hhmm(s.inviteExp)}.`);
      if (st!=='me' && !s.queue.length) scheduleAccept(s, st);
      if (el.dataset.back==='pick') openInvitePick(st); else openShift(id);
      break;
    case 'invitepick': openInvitePick(st); break;
    case 'raise': if (escalate(s,true)){ render(); openShift(id); toast(s.step===2 ? `Rate raised to your maximum, €${s.rate}/h. Nearby ${audience(s)} who've worked at this rate were notified.` : `No applicants yet: rate raised to €${s.rate}/h (your maximum is €${s.maxRate}). Nearby ${audience(s)} were notified.`); } break;
    case 'join': { const h = el.dataset.h; poolOf(h).requests.push('me'); render(); toast(`Request sent to ${h}`); break; }
    case 'approve': { const p = poolOf(HOSP); p.requests=p.requests.filter(x=>x!==st); p.members.push(st); render(); toast(`${P(st).name} joined your staff pool`); break; }
    case 'reject': { const p = poolOf(HOSP); p.requests=p.requests.filter(x=>x!==st); render(); toast('Request declined'); break; }
    case 'eval': openEval(id); break;
    case 'star': {
      draft[el.dataset.k] = Number(v);
      el.parentElement.querySelectorAll('button').forEach(b=>{ const on = Number(b.dataset.v)<=Number(v); b.classList.toggle('on',on); b.setAttribute('aria-checked', b.dataset.v===v); });
      break; }
    case 'submiteval': {
      if (PARAMS.some(([k])=>!draft[k])){ toast('Rate all five criteria to submit.'); break; }
      const sh = S.shifts.find(x=>x.id===draft.id), p = P(sh.assigned);
      PARAMS.forEach(([k])=>{ p.scores[k] = (p.scores[k]*p.n + draft[k])/(p.n+1); }); p.n++;
      sh.evaluated = true;
      const addPool = document.getElementById('evalPool');
      if (addPool && addPool.checked){ const pl = poolOf(HOSP); pl.requests = pl.requests.filter(x=>x!==sh.assigned); if (!pl.members.includes(sh.assigned)) pl.members.push(sh.assigned); }
      render();
      const rest = pendingEvals();
      if (rest.length){ toast(`Evaluation saved. ${rest.length} left.`); openEval(rest[0].id); }
      else { closeModal(); toast('Evaluation saved. All caught up.'); }
      break; }
    case 'rateguide': { const fm = document.getElementById('postForm'); if (!fm) break; const r = Number(v);
      fm.rate.value = r; fm.maxRate.value = Math.round(r*1.15); updateCost(fm);
      document.querySelectorAll('.rg').forEach(b=>b.classList.toggle('on', b===el));
      toast(`Rate set to €${r}/h, maximum €${Math.round(r*1.15)}/h. Adjust either if you like.`); break; }
    case 'nophoto': delete P('me').photo; render(); toast('Photo removed'); break;
    case 'reset': S = fresh(); closeModal(); render(); window.scrollTo(0,0); toast('Demo reset'); break;
  }
});
document.addEventListener('change', e=>{ if (e.target.name==='kind'){ postKind = e.target.value; const pk = postKind==='period';
  document.getElementById('periodFields').hidden = !pk; document.getElementById('dateLbl').textContent = pk?'Start date':'Date';
  document.getElementById('startLbl').textContent = pk?'Daily start':'Start'; document.getElementById('endLbl').textContent = pk?'Daily end':'End';
  document.getElementById('postBtn').textContent = pk?'Post period':'Post shift'; } }, true);
document.addEventListener('change', e=>{ const fm = e.target.form; if (!fm || fm.id!=='postForm' || !['role','quals','ward'].includes(e.target.name)) return;
  if (e.target.name==='ward'){ const [r,q] = WARD_DEFAULT[e.target.value]||['Nurse',[]]; fm.role.value = r; fm.querySelectorAll('[name=quals]').forEach(c=>c.checked=q.includes(c.value)); }
  const role = fm.role.value, quals = role==='Midwife' ? [] : [...fm.querySelectorAll('[name=quals]:checked')].map(c=>c.value);
  document.getElementById('qualBox').hidden = role==='Midwife';
  document.getElementById('reqHint').innerHTML = '<b>Checked before anyone can apply</b>'+reqList(role,quals);
  const gb = document.getElementById('rguideBox'); if (gb) gb.innerHTML = rateGuide(quals); }, true);
document.addEventListener('change', e=>{ const k = e.target.dataset && e.target.dataset.filter; if (!k) return; S.f[k]=e.target.value; render(); });
document.addEventListener('change', e=>{ const d = e.target.dataset||{};
  if (d.rule){ S.rules[d.rule].on = e.target.checked; toast(`Auto-confirm ${e.target.checked?'on':'off'} for ${d.rule}.`); }
  else if (d.rulemin){ S.rules[d.rulemin].min = Number(e.target.value); toast(`${d.rulemin}: auto-confirm pool members rated ${e.target.value}+.`); }
  else if (e.target.id==='availMe'){ S.avail.me = e.target.checked; toast(e.target.checked ? "You're marked available today. You'll hear first about last-minute shifts." : 'No longer marked available today.'); } });
document.addEventListener('input', e=>{ const fm = e.target.form; if (!fm || fm.id!=='postForm' || !['rate','maxRate','start','end'].includes(e.target.name)) return; updateCost(fm); });
document.addEventListener('change', e=>{ const fm = e.target.form; if (fm && fm.id==='postForm' && ['start','end'].includes(e.target.name)) updateCost(fm); });
document.addEventListener('change', e=>{ if (e.target.id==='interimRate'||e.target.id==='interimPay'){ if (e.target.id==='interimRate') INTERIM = Number(e.target.value)||INTERIM; else INTERIM_PAY = Number(e.target.value)||INTERIM_PAY; document.getElementById('cmpPanel').innerHTML = compareInterim(); } });
function updateCost(fm){ const r = Number(fm.rate.value)||0, m = Number(fm.maxRate.value)||0, h = dur({start:fm.start.value||'00:00', end:fm.end.value||'00:00'}); const b = document.getElementById('costBox'); if (b) b.innerHTML = costSummary(r, m, h); }
document.addEventListener('change', e=>{ const fm = e.target.form; if (!fm || fm.id!=='postForm' || !['ward','role','quals','date','start'].includes(e.target.name)) return;
  const quals = fm.role.value==='Midwife' ? [] : [...fm.querySelectorAll('[name=quals]:checked')].map(c=>c.value);
  const rb = document.getElementById('refBox'); if (rb && fm.date.value && fm.start.value) rb.innerHTML = refNote(quals, fm.date.value, fm.start.value); });
document.addEventListener('change', e=>{ if (e.target.id!=='photoIn' || !e.target.files[0]) return;
  const fr = new FileReader(); fr.onload = () => { const im = new Image(); im.onload = () => { const c = document.createElement('canvas'), z = 160, k = Math.min(im.width, im.height);
    c.width = c.height = z; c.getContext('2d').drawImage(im, (im.width-k)/2, (im.height-k)/2, k, k, 0, 0, z, z); P('me').photo = c.toDataURL('image/jpeg', .85); render(); toast('Photo added. Hospitals now see it on your profile and applications.'); };
    im.onerror = () => toast('That file could not be read as an image. Try a JPG or PNG.'); im.src = fr.result; }; fr.readAsDataURL(e.target.files[0]); });
document.addEventListener('input', e=>{ if (e.target.id!=='poolQ') return; const q = e.target.value.trim().toLowerCase(); let n = 0;
  document.querySelectorAll('[data-q]').forEach(r=>{ const on = !q || r.dataset.q.includes(q); r.hidden = !on; if (on) n++; });
  const c = document.getElementById('poolCount'); if (c) c.textContent = q ? `${n} match${n===1?'':'es'}` : `${poolOf(HOSP).members.length} people`; });
document.addEventListener('keydown', e=>{ if (e.key==='Escape') closeModal(); });
document.addEventListener('submit', e=>{
  e.preventDefault();
  if (e.target.id==='poolInvite'){ const em = new FormData(e.target).get('email'); e.target.reset(); toast(`Invitation sent to ${em}`); return; }
  if (e.target.id!=='postForm') return;
  const f = new FormData(e.target);
  const s = {id:'s'+(nextId++),hosp:HOSP,ward:f.get('ward'),role:f.get('role'),quals:f.get('role')==='Midwife'?[]:f.getAll('quals'),date:f.get('date'),start:f.get('start'),end:f.get('end'),rate:Number(f.get('rate')),baseRate:Number(f.get('rate')),maxRate:Number(f.get('maxRate')),win:Number(f.get('win')),step:0,auto:false,
    urgent:!!f.get('urgent'),applicants:[],assigned:null,invited:[],poolOnly:f.get('vis')==='pool',aud:f.get('vis')==='all'?3:f.get('vis')==='pool'?0:1,split:!!f.get('split'),queue:[],prevApps:[],alerted:false,closed:false,reconf:null,done:false,evaluated:false,notes:(f.get('notes')||'').trim(),kind:f.get('kind')};
  if (s.maxRate < s.rate){ toast('Your maximum can’t be lower than your rate.'); return; }
  if (s.start===s.end){ toast('Start and end time can’t be the same. Change one of them.'); return; }
  if (isPeriod(s)){
    s.endDate = f.get('endDate'); s.days = f.getAll('days').map(Number); s.reason = f.get('reason'); s.contract = f.get('contract');
    if (!s.endDate || s.endDate <= s.date){ toast('End date must be after the start date.'); return; }
    if (!s.days.length){ toast('Choose at least one working day.'); return; }
  }
  S.shifts.push(s); S.tab.hosp='shifts'; render(); window.scrollTo(0,0);
  const what = isPeriod(s) ? 'Period' : 'Shift';
  toast(s.poolOnly ? `${what} posted to your staff pool.` : s.aud===1 ? `${what} posted to your pool and nurses who have worked here. It widens automatically if nobody applies.` : `${what} posted. Nearby ${audience(s)} have been notified.`);
  const cand = CANDIDATE[s.ward] && fits(CANDIDATE[s.ward], s) ? CANDIDATE[s.ward] : null;
  if (cand && (!s.poolOnly || status(HOSP,cand)==='member')) setTimeout(()=>{
    if (!s.assigned && !s.applicants.includes(cand) && !s.invited.includes(cand)){ s.applicants.push(cand); if (!tryAuto(s, cand)){ render(); toast(`New applicant: ${P(cand).name} for ${s.ward}, ${whenTxt(s)}`); } }
  }, 6000);
});

render();
</script>
